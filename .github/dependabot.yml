# Routine version updates arrive weekly. Security updates remain separate from
# these version-only groups and use GitHub's separate security-PR limit.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    # Six groups, with room for individual major updates awaiting review.
    open-pull-requests-limit: 8
    labels:
      - dependencies
    commit-message:
      prefix: Update
      include: scope
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
        update-types: [minor, patch]
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
        update-types: [minor, patch]
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types: [minor, patch]
      # Only this explicit group is eligible for opt-in auto-merge. Keep runtime
      # frameworks, UI, deploy/build tools and database tooling outside it.
      routine:
        patterns:
          - "@eslint/js"
          - "@testing-library/dom"
          - "@testing-library/react"
          - "@testing-library/user-event"
          - eslint
          - eslint-config-prettier
          - eslint-plugin-astro
          - eslint-plugin-react-hooks
          - globals
          - jsdom
          - prettier
          - typescript-eslint
          - vitest
          - clsx
        update-types: [minor, patch]
      dev:
        dependency-type: development
        patterns:
          - "*"
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
        update-types: [minor, patch]
